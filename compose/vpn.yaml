services:
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - envs/vpn.env
    environment:
      - TZ=Europe/Rome
    healthcheck:
      test: ["CMD", "wget", "-qO-", "https://api.ipify.org"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - 8081:8081
    restart: unless-stopped
    labels:
      - "group=media-tools"

  qbt-port-sync:
    build:
      context: ../utils/qbittorrent-port-sync
      dockerfile: Dockerfile
    container_name: qbt-port-sync
    restart: unless-stopped
    env_file:
      - envs/qbittorrent.env
    environment:
      - GLUETUN_NAME=gluetun
      - QBT_HOST=gluetun
      - QBT_PORT=8081
      - TZ=Europe/Rome
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - gluetun
    labels:
      - "group=media-tools"

networks:
  media-server-network:
    external: true
