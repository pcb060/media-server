services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui
    environment:
      - TZ=Europe/Rome
      - WEBUI_AUTH=true
      - ENABLE_SIGNUP=false
      - DEFAULT_ROLES=user
      - DEFAULT_USER_ROLE=user
      - WEBUI_NAME=GigioPT
      - WEBUI_URL=https://chat.home.pcb060.dev
      - CORS_ALLOW_ORIGIN=https://chat.home.pcb060.dev
      - WEBUI_SESSION_COOKIE_SECURE=true
      - WEBUI_AUTH_COOKIE_SECURE=true
      - WEBUI_SESSION_COOKIE_SAME_SITE=lax
      - WEBUI_AUTH_COOKIE_SAME_SITE=lax
    volumes:
      - ../configs/openwebui:/app/backend/data
    ports:
      - 13010:8080
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1
      start_period: 30s
      timeout: 5s
      interval: 30s
      retries: 3
    restart: unless-stopped
    labels:
      - "group=utils"

networks:
  media-server-network:
    external: true
