services:
  netalertx:
    image: ghcr.io/netalertx/netalertx:latest
    container_name: netalertx
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - NET_BIND_SERVICE
    volumes:
      - ../configs/netalertx/data:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Europe/Rome
      - PUID=20211
      - PGID=20211
      - PORT=20211
      - GRAPHQL_PORT=20212
    restart: unless-stopped
    labels:
      - "group=network"
    network_mode: host
