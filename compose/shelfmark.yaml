services:
  shelfmark:
    image: ghcr.io/calibrain/shelfmark:latest
    container_name: shelfmark
    volumes:
      - ../configs/shelfmark:/config
      - ../media/downloads/books:/books
    ports:
      - 8084:8084
    restart: unless-stopped
    labels:
      - "group=media"

networks:
  media-server-network:
    external: true